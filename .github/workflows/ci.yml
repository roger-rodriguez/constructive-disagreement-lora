name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.11"
      - name: Sync repository tooling
        run: uv sync --frozen
      - name: Sync app environments
        run: |
          uv sync --directory apps/modeling --group publish --frozen
          uv sync --directory apps/serving --frozen
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Type-check shared contracts
        run: uv run --frozen ty check
      - name: Type-check modeling
        run: uv run --directory apps/modeling --frozen ty check
      - name: Type-check serving
        run: uv run --directory apps/serving --frozen ty check

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          python-version: ${{ matrix.python-version }}
      - name: Sync project environments
        run: |
          uv sync --directory packages/contracts --python ${{ matrix.python-version }} --frozen
          uv sync --directory apps/modeling --group publish --python ${{ matrix.python-version }} --frozen
          uv sync --directory apps/serving --python ${{ matrix.python-version }} --frozen
      - name: Compile Python sources
        run: |
          uv run --directory packages/contracts --frozen python -m compileall -q src tests
          uv run --directory apps/modeling --frozen python -m compileall -q src tests
          uv run --directory apps/serving --frozen python -m compileall -q src tests
      - name: Run unit tests
        run: |
          uv run --directory packages/contracts --frozen python -m unittest discover -s tests
          uv run --directory apps/modeling --frozen python -m unittest discover -s tests
          uv run --directory apps/serving --frozen python -m unittest discover -s tests

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.11"
      - name: Sync locked environments
        run: |
          uv sync --frozen
          uv sync --directory packages/contracts --frozen
          uv sync --directory apps/modeling --group publish --frozen
          uv sync --directory apps/serving --frozen
      - name: Enforce coverage thresholds
        run: uv run --frozen python scripts/run_coverage.py
